#### crowsnest.conf — Prusa MK3 (mini1)
#### Docs: https://github.com/mainsail-crew/crowsnest/blob/v5/README.md
####
#### Port 8080 → /webcam/?action=[stream|snapshot]  (Mainsail default; also used by timelapse)

[crowsnest]
log_level: verbose                      # quiet/verbose/debug
rollover_on_start: false
no_proxy: false

[cam 1]
mode: ustreamer                         # MJPEG (renders in Mainsail AND the HA Moonraker integration)
name: mk3
port: 8080                              # http://mini1/webcam/?action=stream
# C920 capture node, by-id so it survives reboots / device renumbering.
device: /dev/v4l/by-id/usb-046d_HD_Pro_Webcam_C920_2F2B42BF-video-index0
# The C920 hardware-encodes MJPEG up to 1920x1080@30, so 1080p30 is ~0 CPU passthrough
# (cost is USB + network bitrate, not CPU). mini1 is x86 with plenty of headroom.
resolution: 1920x1080
max_fps: 30
# Force MJPG (hardware format) rather than raw YUYV, which would be heavy:
custom_flags: --format=MJPEG
# Lock focus so autofocus stops hunting mid-print. focus_absolute=25 is the tuned
# value carried over from the previous go2rtc setup (known-good for this C920/mount).
# Exposure left on auto (the C920 default) — append auto_exposure=1,exposure_time_absolute=…
# here later if you want to lock it too.
v4l2ctl: focus_automatic_continuous=0,focus_absolute=25
